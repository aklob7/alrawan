<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D91219">
<title>مكتبة الروان</title>
<link rel="manifest" href="manifest.json?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon2.png">
<link rel="icon" href="icon2-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#D91219;--red-d:#B50E14;--white:#fff;--black:#111;--grey:#444}
*{box-sizing:border-box}
html,body{margin:0;background:var(--red);color:var(--black);font-family:'Tajawal',system-ui,sans-serif;font-size:16px}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:24px 16px 32px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:24px;font-weight:800;color:var(--white)}
h2{margin:6px 0 0;font-size:19px;font-weight:800;color:var(--white)}
p{margin:0}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.card{background:var(--white);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
button,.btn{font-family:inherit;font-size:17px;font-weight:800;border:none;border-radius:14px;padding:14px 16px;min-height:48px;cursor:pointer;text-align:center;text-decoration:none;display:block;width:100%}
.b-red{background:var(--red);color:var(--white)}
.b-white{background:var(--white);color:var(--black)}
.b-black{background:var(--black);color:var(--white)}
.b-line{background:var(--white);color:var(--black);border:2px solid var(--black)}
.b-on{background:var(--red);color:var(--white);border:2px solid var(--red)}
.tile{background:var(--white);color:var(--black);border-radius:16px;padding:18px 10px;font-size:17px;font-weight:800;min-height:76px;display:flex;align-items:center;justify-content:center;text-align:center}
.icon{width:48px;height:48px;min-height:48px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
label{font-weight:700;font-size:15px}
input,select,textarea{font-family:inherit;font-size:17px;padding:13px 14px;border:2px solid var(--black);border-radius:12px;width:100%;background:var(--white);color:var(--black)}
.field{display:flex;flex-direction:column;gap:6px}
.hint{font-size:14px;color:var(--grey)}
.price{font-weight:800;color:var(--red-d)}
.line{display:flex;justify-content:space-between;gap:10px;font-size:16px}
.total{font-size:19px;font-weight:800;border-top:2px solid var(--black);padding-top:10px}
.msg{background:var(--black);color:var(--white);border-radius:14px;padding:12px 14px;font-weight:700}
.tag{font-size:13px;font-weight:800;border:2px solid var(--black);border-radius:10px;padding:5px 9px;white-space:nowrap}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:44px;min-height:44px;padding:0}
.logo{border-radius:50%;object-fit:cover;display:block}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;flex:1;text-align:center}
.slot{aspect-ratio:1;border:2px dashed var(--black);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--grey)}
.stamp{aspect-ratio:1;border:3px solid var(--red);outline:1.5px solid var(--red);outline-offset:-7px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--red-d);transform:rotate(-12deg)}
.stamp.new{animation:drop .65s cubic-bezier(.3,1.4,.5,1) both}
.splash{width:min(84vw,400px);height:auto;border-radius:28px;box-shadow:0 24px 50px rgba(0,0,0,.4);animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.spin{animation:spin 5s ease-in-out infinite;box-shadow:6px 0 0 #9E0C12,12px 0 0 #8A0A10,0 30px 50px rgba(0,0,0,.35);border-radius:50%}
@keyframes spin{0%,100%{transform:rotateY(-38deg) rotateX(8deg)}50%{transform:rotateY(38deg) rotateX(-6deg)}}
@keyframes drop{0%{opacity:0;transform:scale(2.8) rotate(18deg)}55%{opacity:1;transform:scale(.86) rotate(-16deg)}100%{transform:scale(1) rotate(-12deg)}}
/* ---------- عمق ثلاثي الأبعاد ---------- */
html{background:#A90D13}
body{background:radial-gradient(130% 70% at 50% 0%,#F4333A 0%,#D91219 42%,#A90D13 100%) fixed #D91219}
h1{text-shadow:0 2px 0 rgba(0,0,0,.22)}
h2{text-shadow:0 2px 0 rgba(0,0,0,.2)}
.card{box-shadow:0 7px 0 #D6D6D6,0 18px 26px rgba(0,0,0,.3)}
button,.btn{transition:transform .06s ease,box-shadow .06s ease;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.b-red{background:linear-gradient(#F0303A,#D91219);box-shadow:0 5px 0 #8A0A10,0 10px 16px rgba(0,0,0,.22)}
.b-white{box-shadow:0 5px 0 #CFCFCF,0 12px 18px rgba(0,0,0,.28)}
.b-black{background:linear-gradient(#2B2B2B,#111);box-shadow:0 5px 0 #000,0 12px 18px rgba(0,0,0,.3)}
.b-line{box-shadow:0 4px 0 #111}
.b-on{background:linear-gradient(#F0303A,#D91219);box-shadow:0 4px 0 #8A0A10}
button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
button:disabled{opacity:.7}
.tile{flex-direction:column;gap:8px;border:none;background:linear-gradient(#FFFFFF,#F3F3F3);box-shadow:0 8px 0 #D2D2D2,0 18px 24px rgba(0,0,0,.32);min-height:104px}
.tile:active{transform:translateY(7px);box-shadow:0 1px 0 #D2D2D2,0 4px 8px rgba(0,0,0,.3)}
.tile svg{width:40px;height:40px;color:var(--red);filter:drop-shadow(0 3px 0 rgba(0,0,0,.14))}
.tile.plain{min-height:76px}
.row>.logo{box-shadow:0 0 0 3px #fff,0 6px 0 rgba(0,0,0,.25),0 12px 16px rgba(0,0,0,.3)}
input,select,textarea{box-shadow:inset 0 3px 0 rgba(0,0,0,.08)}
.msg{box-shadow:0 5px 0 #000,0 12px 18px rgba(0,0,0,.3)}
.stamp{background:#fff;box-shadow:0 3px 0 rgba(181,14,20,.35)}
.slot{box-shadow:inset 0 3px 0 rgba(0,0,0,.1)}
.coverbtn{padding:0;width:auto;min-height:0;background:none;border-radius:10px;flex-shrink:0;box-shadow:0 5px 0 #CFCFCF,0 10px 14px rgba(0,0,0,.28)}
.cover{display:block;width:96px;height:134px;object-fit:cover;border-radius:10px;background:#eee}
#zoom{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;border:none;border-radius:0;width:100%;box-shadow:none}
.adimg{width:100%;max-height:260px;object-fit:cover;border-radius:12px;display:block;background:#eee}
#zoom img{max-width:100%;max-height:82vh;border-radius:14px;box-shadow:0 20px 40px rgba(0,0,0,.6)}
#zoom span{color:#fff;font-weight:800}
.owl{display:block;flex-shrink:0;overflow:visible}
.owl-all{transform-box:fill-box;transform-origin:50% 100%;animation:owlSway 6s ease-in-out infinite}
.owl-body{transform-box:fill-box;transform-origin:50% 100%;animation:owlBreathe 3.2s ease-in-out infinite}
.owl-lids{opacity:0;animation:owlBlink 4.6s infinite}
.owl-pupils{animation:owlLook 8s ease-in-out infinite}
.owl-wl{transform-box:fill-box;transform-origin:100% 0;animation:owlWing 3.2s ease-in-out infinite}
.owl-wr{transform-box:fill-box;transform-origin:0 0;animation:owlWing 3.2s ease-in-out infinite reverse}
@keyframes owlBreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,1.055)}}
@keyframes owlBlink{0%,91%,100%{opacity:0}93%,96%{opacity:1}}
@keyframes owlSway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes owlLook{0%,30%,55%,80%,100%{transform:translateX(0)}38%,48%{transform:translateX(2.5px)}63%,73%{transform:translateX(-2.5px)}}
@keyframes owlWing{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}
.badge{position:absolute;top:-6px;inset-inline-end:-6px;min-width:22px;height:22px;border-radius:11px;background:#111;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #fff}
#drawer-bg{position:fixed;inset:0;z-index:7;background:rgba(0,0,0,.55);border:none;border-radius:0;width:100%;min-height:0;padding:0;box-shadow:none;animation:fadeIn .2s both}
#drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;z-index:8;width:min(86vw,340px);background:#fff;display:flex;flex-direction:column;gap:12px;padding:20px 16px;overflow-y:auto;box-shadow:-12px 0 40px rgba(0,0,0,.45);animation:drawerIn .28s cubic-bezier(.2,.9,.3,1) both}
[dir=rtl] #drawer{box-shadow:-12px 0 40px rgba(0,0,0,.45)}
@keyframes drawerIn{from{transform:translateX(105%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.dhead{background:linear-gradient(#F0303A,#B50E14);border-radius:18px;padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;text-align:center;box-shadow:0 6px 0 #8A0A10}
.avatar{width:92px;height:92px;min-height:0;border-radius:50%;padding:0;background:#fff;color:var(--red);font-size:38px;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 4px #fff,0 6px 0 rgba(0,0,0,.25)}
.avatar img{width:100%;height:100%;object-fit:cover}
.ditem{display:flex;align-items:center;gap:12px;justify-content:flex-start;text-align:start;position:relative}
.ditem svg{width:24px;height:24px;flex-shrink:0}
.ditem .badge{position:static;margin-inline-start:auto;border:none;background:var(--red)}
.mini{display:flex;align-items:center;gap:12px;text-align:start;background:linear-gradient(#fff,#F3F3F3);color:#111;box-shadow:0 7px 0 #D6D6D6,0 18px 26px rgba(0,0,0,.3)}
.pips{display:flex;gap:5px;flex-wrap:wrap}.pips i{width:14px;height:14px;border-radius:50%;border:2px solid #111}.pips i.on{background:var(--red);border-color:var(--red)}
@keyframes adIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.adin{animation:adIn .45s ease-out both}
.promo{display:flex;gap:8px}.promo input{flex:1;text-transform:uppercase}.promo button{width:auto}
/* السلة العائمة */
#cartbar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 16px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
#cartbar button{pointer-events:auto;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;background:#111;color:#fff;box-shadow:0 5px 0 #000,0 14px 26px rgba(0,0,0,.4);animation:barIn .25s ease-out}
#cartbar .cnt{background:var(--red);border-radius:10px;padding:2px 10px;font-size:15px}
#cartbar .sum{margin-inline-start:auto}
body.hasbar #app{padding-bottom:96px}
@keyframes barIn{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
/* مراجعة الطلب */
#review-bg{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.6)}
#review{position:fixed;left:12px;right:12px;bottom:12px;max-width:560px;margin:0 auto;z-index:9;max-height:86vh;overflow:auto;background:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
#review h2{color:#111;text-shadow:none}
#review ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px;font-weight:700}
.ring{width:54px;height:54px;border-radius:50%;border:4px solid var(--red);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:var(--red);flex-shrink:0}
/* البومة النائمة */
.zzz{display:none}
.owl.sleep .zzz{display:inline}
.owl.sleep .owl-lids{opacity:1;animation:none}
.owl.sleep .owl-pupils{opacity:0}
.owl.sleep .owl-all{animation:owlSway 9s ease-in-out infinite}
.zzz text{font-family:system-ui,sans-serif;font-weight:900;fill:#111;animation:zFloat 3s ease-in-out infinite;opacity:0}
.zzz text:nth-child(2){animation-delay:1s}.zzz text:nth-child(3){animation-delay:2s}
@keyframes zFloat{0%{opacity:0;transform:translate(0,6px)}30%{opacity:1}100%{opacity:0;transform:translate(8px,-14px)}}
.night{background:#1B1F3A;color:#fff}
.night .hint{color:#C9CCE6}
@media (prefers-reduced-motion:reduce){.zzz text{animation:none;opacity:1}#cartbar button{animation:none}}
@media (prefers-reduced-motion:reduce){.owl-all,.owl-body,.owl-lids,.owl-pupils,.owl-wl,.owl-wr,#drawer,#drawer-bg,.adin{animation:none}}
.adcard{position:relative;overflow:hidden}
.adcard::after{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:10px;background:var(--red)}
.dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:4px;background:#111}.dots i.on{width:22px;background:var(--red)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes flipIn{from{opacity:0;transform:perspective(700px) rotateX(-58deg) translateY(26px)}to{opacity:1;transform:none}}
.enter>*{animation:rise .18s ease-out both}
.enter>*:nth-child(2){animation-delay:.02s}.enter>*:nth-child(3){animation-delay:.04s}.enter>*:nth-child(4){animation-delay:.06s}.enter>*:nth-child(n+5){animation-delay:.08s}
.enter .tile{animation:flipIn .28s cubic-bezier(.2,.9,.3,1.15) both;transform-origin:50% 100%}
.enter .tile:nth-child(2){animation-delay:.03s}.enter .tile:nth-child(3){animation-delay:.06s}.enter .tile:nth-child(4){animation-delay:.09s}.enter .tile:nth-child(5){animation-delay:.12s}.enter .tile:nth-child(6){animation-delay:.15s}.enter .tile:nth-child(n+7){animation-delay:.18s}
@media (prefers-reduced-motion:reduce){.spin,.splash,.stamp.new,.enter>*,.enter .tile{animation:none}button,.btn{transition:none}}
/* ---------- الواجهة الجديدة: شريط نصي، إعلانات تُسحب، رفوف منتجات ---------- */
.ticker{background:#111;color:#fff;border-radius:12px;overflow:hidden;white-space:nowrap;font-weight:800;font-size:15px;padding:9px 0;box-shadow:0 4px 0 #000}
.tk-in{display:inline-block;animation:tk var(--tkd,20s) linear infinite}
.tk-in span{padding:0 18px}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(50%)}}
.adwrap{position:relative;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 7px 0 #D6D6D6,0 18px 26px rgba(0,0,0,.3)}
.adrail{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.adrail::-webkit-scrollbar{display:none}
.adslide{flex:0 0 100%;scroll-snap-align:center;position:relative;padding:0;margin:0;border:none;border-radius:0;min-height:0;background:#fff;box-shadow:none;display:block}
.adslide:active{transform:none;box-shadow:none}
.adslide img{width:100%;aspect-ratio:2/1;object-fit:cover;display:block;background:#eee}
.adslide .adcap{position:absolute;inset-inline:0;bottom:0;padding:22px 12px 24px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-weight:800;font-size:15px;text-align:start}
.adslide .adgo{position:absolute;top:10px;inset-inline-end:10px;background:var(--red);color:#fff;font-size:13px;font-weight:800;border-radius:20px;padding:5px 11px;box-shadow:0 3px 0 #8A0A10}
.addots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:6px;pointer-events:none}
.addots i{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.65);box-shadow:0 0 0 1px rgba(0,0,0,.25);transition:width .2s}
.addots i.on{width:20px;background:#fff}
.secs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sec{background:linear-gradient(#fff,#F3F3F3);color:#111;border-radius:14px;padding:10px 4px;min-height:78px;font-size:12.5px;font-weight:800;line-height:1.25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;box-shadow:0 5px 0 #D2D2D2,0 10px 14px rgba(0,0,0,.25)}
.sec svg{width:28px;height:28px;color:var(--red)}
.sec:active{transform:translateY(4px);box-shadow:0 1px 0 #D2D2D2}
.shelf{display:flex;flex-direction:column;gap:8px}
.shelf-h{display:flex;align-items:center;gap:8px}
.shelf-h h2{margin:0;flex:1;font-size:18px}
.shelf-h button{width:auto;min-height:34px;padding:6px 12px;font-size:14px;border-radius:20px}
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 12px;margin:0 -16px;padding-inline:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.pc{flex:0 0 132px;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 5px 0 #D6D6D6,0 10px 16px rgba(0,0,0,.25)}
.pc>button.pt{padding:0;margin:0;border:none;border-radius:0;background:#fff;min-height:0;box-shadow:none;display:flex;flex-direction:column;text-align:start;font-weight:700;font-size:13px;width:100%}
.pc>button.pt:active{transform:scale(.97);box-shadow:none}
.pc img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#eee}
.pc .pn{padding:7px 8px 0;font-size:12.5px;font-weight:800;line-height:1.3;height:40px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pc .ps{margin:5px 8px 0;font-size:11.5px;font-weight:800;color:#fff;background:#111;border-radius:8px;padding:2px 7px;align-self:flex-start;max-width:calc(100% - 16px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .pp{padding:5px 8px 9px;font-size:14px;font-weight:900;color:var(--red-d)}
.pc .pq{position:absolute;top:7px;inset-inline-start:7px;min-width:26px;height:26px;border-radius:13px;background:var(--red);color:#fff;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;padding:0 6px;border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.pc .pm{position:absolute;top:7px;inset-inline-end:7px;width:30px;height:30px;min-height:0;border-radius:50%;padding:0;background:#111;color:#fff;font-size:20px;line-height:1;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.pc .pim{position:relative;display:block}
.pc .pplus{position:absolute;bottom:7px;inset-inline-end:7px;width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.35);pointer-events:none}
.pc.out{opacity:.55}
.pc.bump{animation:bump .3s ease-out}
@keyframes bump{40%{transform:scale(1.06)}}
.newtag{position:absolute;top:7px;inset-inline-end:7px;background:#FFD400;color:#111;font-size:11px;font-weight:900;border-radius:8px;padding:2px 7px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
#toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;z-index:6;background:#fff;color:#111;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:barIn .2s ease-out}
#toast button{width:auto;min-height:36px;padding:6px 12px;font-size:14px}
#sheet-bg{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.6);border:none;border-radius:0;width:100%;min-height:0;padding:0;box-shadow:none;animation:fadeIn .2s both}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;z-index:9;background:#fff;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto;animation:sheetIn .25s cubic-bezier(.2,.9,.3,1) both}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
#sheet img{width:100%;max-height:52vh;object-fit:contain;border-radius:12px;background:#f3f3f3}
.owlfam .chick{transform-box:fill-box;transform-origin:50% 100%;animation:hop 1.6s ease-in-out infinite}
.owlfam .chick.c2{animation-delay:.8s;animation-duration:1.9s}
.owlfam .chick .cw{transform-box:fill-box;transform-origin:50% 0;animation:flap .4s ease-in-out infinite alternate}
@keyframes hop{0%,55%,100%{transform:translateY(0)}70%{transform:translateY(-7px) rotate(-6deg)}85%{transform:translateY(0) rotate(4deg)}}
@keyframes flap{to{transform:rotate(18deg)}}

  return '<section class="shelf"><div class="shelf-h"><h2>' + esc(title) + '</h2>' + (sec ? '<button class="b-white" data-act="sec" data-v="' + esc(sec) + '">عرض الكل</button>' : '') + '</div>' +
    '<div class="rail" data-keep="' + esc(key) + '">' + list.map(p => pcard(p, isNew)).join('') + '</div></section>';
}
function shelvesHTML() {
  const ps = S.cat.products.filter(p => hasImg(p.img) && p.avail);
  let out = shelf('جديدنا ✨', ps.slice(-14).reverse(), 'new', '', true);
  const st = S.user && S.user.stage;
  if (st) out += shelf('ملازم ' + st, dayShuffle(ps.filter(p => p.sec === 'الملازم' && p.l1 === st), 'st'), 'mine', '');
  S.cat.sections.forEach(sec => { out += shelf(sec, dayShuffle(ps.filter(p => p.sec === sec), sec).slice(0, 18), 's_' + sec, sec); });
  return out;
}

function refreshP(id, bump) {
  const p = prod(id); if (!p) return;
  document.querySelectorAll('.pc[data-pid="' + CSS.escape(String(id)) + '"]').forEach(el => {
    const t = document.createElement('div'); t.innerHTML = pcard(p, el.dataset.new === '1'); const nn = t.firstChild;
    el.replaceWith(nn); hydrate(); if (bump) nn.classList.add('bump');
  });
  const n = cartCount(), h = document.getElementById('hcart'); if (h) h.textContent = 'السلة' + (n ? ' (' + n + ')' : '');
  renderBar();
  if (S.sheet) document.getElementById('layer').innerHTML = sheetHTML();
}
let toastT = null;
function toast(text, undoId) {
  let t = document.getElementById('toast'); if (t) t.remove();
  t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = '<span class="grow">' + esc(text) + '</span>' + (undoId ? '<button class="b-line" data-act="undoP" data-v="' + esc(undoId) + '">تراجع</button>' : '');
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
}

      '<div class="grow"><p style="font-weight:800">' + esc(S.user.name) + '</p><p class="hint">' + (S.user.type === 'student' ? 'طالب' + (S.user.stage ? ' · ' + esc(S.user.stage) : '') : 'زبون') + ' · بطاقة الوفاء</p></div><strong class="price">' + have + ' / ' + total + '</strong></div>' +
      '<div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px">' + g + '</div>' +
      '<p style="font-weight:700">كل ملزمة تستلمها = ختم (الملازم فقط). عند اكتمال البطاقة تحصل على هدية: مادة مجانية من اختيارك' + (Number(S.cat.settings.rewardMax) ? ' (حتى ' + money(S.cat.settings.rewardMax) + ')' : '') + '، تدفع فقط رسوم الخدمة والتوصيل.</p>' +
      (S.rewards ? '<p class="msg">لديك ' + (S.rewards > 1 ? S.rewards + ' هدايا' : 'هدية') + ' 🎁 أضف المادة التي تريدها إلى السلة، واخترها كهدية في صفحة تأكيد الطلب.</p>' : '') +
      (done ? '<p class="hint">بطاقات مكتملة: ' + done + '</p>' : '') + '</div>';
  }
};
function render() {
  const app = document.getElementById('app');
  const keep = {}; if (!S.anim) document.querySelectorAll('[data-keep]').forEach(e => { keep[e.dataset.keep] = e.scrollLeft; });
  app.className = S.anim ? 'enter' : '';
  app.innerHTML = V[S.view]();
  document.getElementById('layer').innerHTML = S.review ? reviewHTML() : S.sheet ? sheetHTML() : S.drawer && S.user ? drawerHTML() : '';
  renderBar();
  document.querySelectorAll('[data-keep]').forEach(e => { if (keep[e.dataset.keep] != null) e.scrollLeft = keep[e.dataset.keep]; });
  const ar = document.getElementById('adrail'); if (ar && S.ad) ar.scrollLeft = (S.ad % ar.children.length) * ar.clientWidth;
  hydrate();
  if (S.anim) window.scrollTo(0, 0);
  S.anim = false;
}
function reviewHTML() {
  const c = calc(), co = S.co, r = S.review;
  return '<div id="review-bg"></div><div id="review" role="dialog" aria-modal="true" aria-labelledby="rv-t">' +
    '<div class="row"><h2 id="rv-t" class="grow" style="margin:0">راجع طلبك</h2><span class="ring" id="rv-n" aria-live="polite">' + r.left + '</span></div>' +
    '<p class="hint">أنت طلبت:</p><ul>' + cartLines().map(l => '<li>' + esc(l.p.name) + ' × ' + l.q + ' — ' + money(l.p.price * l.q) + (String(S.reward) === String(l.p.id) && c.free ? ' 🎁' : '') + '</li>').join('') + '</ul>' +
    '<div class="line"><span>الاستلام</span><span>' + (co.mode === 'delivery' ? 'توصيل' + (co.area ? ' — ' + esc(co.area) : '') : 'من المحل') + '</span></div>' +
    '<div class="line"><span>الدفع</span><span>' + (co.pay === 'online' ? 'دفع إلكتروني' : 'عند الاستلام') + '</span></div>' +
    (c.free ? '<div class="line price"><span>هدية الوفاء</span><span>− ' + money(c.free) + '</span></div>' : '') +
    (c.discount ? '<div class="line price"><span>الخصم</span><span>− ' + money(c.discount) + '</span></div>' : '') +
    '<div class="line"><span>رسوم الخدمة</span><span>' + money(c.fee) + '</span></div>' +
    (co.mode === 'delivery' ? '<div class="line"><span>التوصيل</span><span>' + money(c.delivery) + '</span></div>' : '') +
    '<div class="line total"><span>التكلفة الكلية</span><span>' + money(c.total) + '</span></div>' +
    (isClosed() ? '<p class="msg">🌙 خارج الدوام: يُجهَّز طلبك صباحاً عند بدء الدوام.</p>' : '') +
    '<p style="font-weight:800;text-align:center">هل أنت متأكد؟</p>' +
    '<div class="grid"><button class="b-line" data-act="reviewCancel">إلغاء</button>' +
    '<button class="b-red" id="rv-ok" data-act="send"' + (r.left > 0 || S.busy ? ' disabled' : '') + '>' + (S.busy ? 'جارِ الإرسال…' : r.left > 0 ? 'تأكيد (' + r.left + ')' : 'تأكيد الطلب') + '</button></div></div>';
}
let reviewTimer = null;
function stopReview() { clearInterval(reviewTimer); reviewTimer = null; S.review = null; }
function go(v) { S.view = v; S.msg = ''; S.anim = true; S.drawer = false; S.sheet = null; const t = document.getElementById('toast'); if (t) t.remove(); render(); }
function saveCart() { store.set('rw_cart', S.cart); }
function syncCo() {
  const a = document.getElementById('f-area'), n = document.getElementById('f-note'), ad = document.getElementById('f-addr'), pc = document.getElementById('f-promo');
  if (pc && pc.value.trim().toUpperCase() !== S.promo.code) S.promo = { code: pc.value.trim().toUpperCase(), discount: 0 };
  if (a) S.co.area = a.value;
  if (ad) S.co.addr = ad.value;
  if (n) S.co.note = n.value;
}
function loadStatus(view) {
  const keep = S.msg;
  S.view = view; S.anim = true; S.drawer = false; S.loading = true; render(); S.msg = keep;
  api('status', auth()).then(r => {
    S.loading = false;
    if (r.ok) gotStatus(r); else S.msg = r.error || 'تعذر التحميل';
    if (S.view === view && !S.review) render();
  });
}

const ACT = {
  tapP(d) {
    const p = prod(d.v); if (!p) return;
    if (!p.avail) { toast('غير متوفر حالياً'); return; }
    S.cart[p.id] = (S.cart[p.id] || 0) + 1; S.promo.discount = 0; saveCart(); refreshP(p.id, true);
    toast('أُضيفت «' + p.name.split(' — ')[0] + '» إلى السلة ✓', p.id);
    if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) {}
  },
  incP(d) { S.cart[d.v] = (S.cart[d.v] || 0) + 1; S.promo.discount = 0; saveCart(); refreshP(d.v, true); },
  decP(d) { S.promo.discount = 0; S.cart[d.v] = Math.max(0, (S.cart[d.v] || 0) - 1); if (!S.cart[d.v]) delete S.cart[d.v]; saveCart(); refreshP(d.v); },
  undoP(d) { ACT.decP(d); const t = document.getElementById('toast'); if (t) t.remove(); },
  adTap(d) {
    const a = imgAds()[+d.v]; if (!a) return;
    const l = linkOf(a);
    if (l && l.p) { S.sheet = l.p.id; render(); return; }
    if (l && l.s) { ACT.sec({ v: l.s }); return; }
    ACT.zoom({ v: a.img });
  },
  closeSheet() { S.sheet = null; render(); },
  start() { go(S.user ? 'home' : 'register'); refreshStatus(); },
  openDrawer() { S.drawer = true; render(); },
  closeDrawer() { S.drawer = false; render(); },
  photo() { document.getElementById('f-photo').click(); },
  offers() { S.seen = offers().map(offerId); store.set('rw_seen', S.seen); go('offers'); },
  promo() {
    syncCo();
    if (!S.promo.code) { S.msg = 'اكتب كود الخصم'; render(); return; }
    S.busy = true; S.msg = ''; render();
    api('promo', Object.assign({ promo: S.promo.code, items: cartLines().map(l => ({ id: l.p.id, qty: l.q })) }, auth())).then(r => {
      S.busy = false;
      if (!r.ok) { S.promo.discount = 0; S.msg = r.error || 'كود الخصم غير صحيح'; } else { S.promo = { code: r.code, discount: r.discount }; S.msg = ''; }
      render();
    });
  },
  home() { go('home'); },
  regType(d) {
    const ids = ['f-phone', 'f-name'];
    const keep = ids.map(i => document.getElementById(i).value);
    S.regType = d.v; render();
    ids.forEach((i, k) => { document.getElementById(i).value = keep[k]; });
  },
  register() {
    const val = i => { const e = document.getElementById(i); return e ? e.value.trim() : ''; };
    const d = { phone: val('f-phone').replace(/\s/g, ''), name: val('f-name'), type: S.regType, stage: val('f-stage') };
    let err = '';
    if (!/^07\d{9}$/.test(d.phone)) err = 'رقم الهاتف يجب أن يكون ١١ رقماً يبدأ بـ 07';
    else if (!d.name) err = 'اكتب اسمك';
    else if (d.type === 'student' && !d.stage) err = 'اختر مرحلتك';
    if (err) { S.msg = err; render(); return; }
    S.busy = true; S.msg = ''; render();
    api('register', d).then(r => {
      S.busy = false;
      if (!r.ok) { S.msg = r.error || 'تعذر التسجيل'; render(); return; }
      S.user = { phone: d.phone, name: d.name, type: d.type, stage: d.stage, token: r.token, code: r.code || '' };
      S.newCode = r.code || ''; store.set('rw_user', S.user); go(S.newCode ? 'welcome' : 'home'); refreshStatus();
    });
  },
  zoom(d) {
    const z = document.createElement('button'); z.id = 'zoom'; z.setAttribute('aria-label', 'إغلاق الصورة');
    const im = document.createElement('img'); im.src = isUp(d.v) ? (IMGS[d.v] || '') : d.v; im.alt = 'صورة المنتج';
    const t = document.createElement('span'); t.textContent = 'اضغط للإغلاق';
    z.appendChild(im); z.appendChild(t); z.onclick = () => z.remove(); document.body.appendChild(z);
  },
  toLogin() { go('login'); },
  toRegister() { go('register'); },
  login() {
    const phone = document.getElementById('l-phone').value.replace(/\s/g, ''), code = document.getElementById('l-code').value.trim();
    if (!/^07\d{9}$/.test(phone) || !code) { S.msg = 'اكتب رقم الهاتف ورقم الحساب'; render(); return; }
    S.busy = true; S.msg = ''; render();
    api('login', { phone, code }).then(r => {
      S.busy = false;
      if (!r.ok) { S.msg = r.error || 'تعذر الدخول'; render(); return; }
      S.user = { phone, name: r.name, type: r.type, stage: r.stage, token: r.token, code: r.code || '' };
      store.set('rw_user', S.user); go('home'); refreshStatus();
    });
  },
  logout() { S.user = null; S.stamps = 0; S.rewards = 0; S.reward = ''; S.orders = []; S.cart = {}; try { localStorage.removeItem('rw_user'); localStorage.removeItem('rw_cart'); } catch (e) {} go('login'); },
  sec(d) { S.sec = d.v; S.path = []; go('browse'); },
  grp(d) { S.path.push(d.v); go('browse'); },
  back() { if (S.path.length) { S.path.pop(); go('browse'); } else go('home'); },
  inc(d) { S.cart[d.v] = (S.cart[d.v] || 0) + 1; S.promo.discount = 0; saveCart(); render(); },
  dec(d) { S.promo.discount = 0; S.cart[d.v] = Math.max(0, (S.cart[d.v] || 0) - 1); if (!S.cart[d.v]) delete S.cart[d.v]; saveCart(); render(); },
  cart() { go('cart'); },
  checkout() { go('checkout'); },
  mode(d) { syncCo(); S.co.mode = d.v; render(); },
  pay(d) { syncCo(); S.co.pay = d.v; render(); },
  gift(d) { syncCo(); S.reward = d.v; S.promo.discount = 0; render(); },
  locate() {
    syncCo();
    const fail = t => { S.locating = false; S.msg = t; render(); };
    if (!window.isSecureContext) return fail('تحديد الموقع يعمل فقط عند فتح التطبيق من رابطه على الإنترنت (https)، لا من ملف على الجهاز.');
    if (!navigator.geolocation) return fail('جهازك لا يدعم تحديد الموقع.');
    S.locating = true; S.msg = ''; render();
    const ok = p => { S.locating = false; S.co.lat = p.coords.latitude; S.co.lng = p.coords.longitude; S.msg = ''; render(); };
    const err = (e, retried) => {
      if (e.code === 1) return fail('لم تسمح للتطبيق بالوصول إلى الموقع. اسمح به من إعدادات المتصفح ثم أعد المحاولة.');
      // فشل GPS الدقيق: نحاول مرة واحدة بالدقة العادية (شبكة الهاتف والواي فاي)
      if (!retried) return navigator.geolocation.getCurrentPosition(ok, x => err(x, true), { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 });
      fail(e.code === 3 ? 'انتهت المهلة قبل تحديد الموقع. تأكد أن خدمة الموقع (GPS) مفعّلة.' : 'تعذر تحديد الموقع. تأكد أن خدمة الموقع (GPS) مفعّلة.');
    };
    navigator.geolocation.getCurrentPosition(ok, e => err(e, false), { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 });
  },
  confirm() {
    syncCo();
    const co = S.co;
    if (co.mode === 'delivery' && !co.area) { S.msg = 'اختر منطقة التوصيل'; render(); return; }
    if (co.mode === 'delivery' && !co.lat) { S.msg = 'يجب تحديد موقعك أولاً لإرسال طلب التوصيل. اضغط زر "حدّد موقعي".'; render(); return; }
    if (!cartLines().length) { S.msg = 'السلة فارغة'; render(); return; }
    stopReview(); S.msg = ''; S.review = { left: 10 }; render();
    reviewTimer = setInterval(() => {
      if (!S.review) return stopReview();
      S.review.left = Math.max(0, S.review.left - 1);
      const n = document.getElementById('rv-n'), ok = document.getElementById('rv-ok');
      if (n) n.textContent = S.review.left;
      if (ok) { ok.disabled = S.review.left > 0; ok.textContent = S.review.left > 0 ? 'تأكيد (' + S.review.left + ')' : 'تأكيد الطلب'; }
      if (!S.review.left) { clearInterval(reviewTimer); reviewTimer = null; if (ok) ok.focus(); }
    }, 1000);
  },
  reviewCancel() { stopReview(); render(); },
  send() {
    if (!S.review || S.review.left > 0 || S.busy) return;
    const co = S.co, sentItems = cartLines().map(l => l.p.name + ' × ' + l.q).join('، ');
    S.busy = true; S.msg = ''; render();
    const items = cartLines().map(l => ({ id: l.p.id, qty: l.q }));
    api('order', Object.assign({ items, mode: co.mode, area: co.area, pay: co.pay, lat: co.lat, lng: co.lng, reward: calc().free ? S.reward : '', promo: S.promo.discount ? S.promo.code : '', note: (co.mode === 'delivery' && co.addr.trim() ? 'العنوان: ' + co.addr.trim() + (co.note ? ' | ' : '') : '') + co.note }, auth())).then(r => {
      S.busy = false; stopReview();
      if (!r.ok) { S.msg = r.error || 'تعذر إرسال الطلب'; render(); return; }
      S.cart = {}; saveCart(); S.co.note = ''; S.promo = { code: '', discount: 0 }; S.reward = '';
      S.msg = r.order && r.order.deferred ? 'تم إرسال طلبك ✓ المكتبة مغلقة الآن، ويُجهَّز طلبك صباحاً عند بدء الدوام.' : 'تم إرسال طلبك ✓';
      if (r.order) S.orders = [{ no: r.order.no, date: '', items: sentItems, total: r.order.total, pay: co.pay, status: r.order.deferred ? 'مؤجل' : 'جديد' }].concat(S.orders || []);
      loadStatus('orders');
    });
  },
  orders() { loadStatus('orders'); },
  loyalty() { loadStatus('loyalty'); },
  branches() { go('branches'); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && ACT[b.dataset.act]) ACT[b.dataset.act](b.dataset);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.review && !S.busy) { stopReview(); render(); } else if (e.key === 'Escape' && S.sheet) { S.sheet = null; render(); } });
document.addEventListener('change', e => {
  if (e.target.dataset.change === 'area') { syncCo(); render(); }
  if (e.target.id === 'f-photo' && e.target.files && e.target.files[0]) {
    const im = new Image(), url = URL.createObjectURL(e.target.files[0]);
    im.onload = () => {
      const c = document.createElement('canvas'), s = 200, m = Math.min(im.width, im.height); c.width = c.height = s;
      c.getContext('2d').drawImage(im, (im.width - m) / 2, (im.height - m) / 2, m, m, 0, 0, s, s);
      S.photo = c.toDataURL('image/jpeg', 0.8); store.set('rw_photo', S.photo); URL.revokeObjectURL(url); e.target.value = ''; render();
    };
    im.onerror = () => { URL.revokeObjectURL(url); S.msg = 'تعذر قراءة الصورة'; render(); };
    im.src = url;
  }
});
let wasClosed = null;
setInterval(() => { const c = isClosed(); if (wasClosed !== null && c !== wasClosed && !S.review && (S.view === 'home' || S.view === 'checkout')) render(); wasClosed = c; }, 30000);
/* إعلانات الصور: يسحبها الزبون بإصبعه، وتتقلب وحدها إن تركها */
let adTouch = 0;
['touchstart', 'pointerdown', 'wheel'].forEach(ev => document.addEventListener(ev, e => { if (e.target.closest && e.target.closest('#adrail')) adTouch = Date.now(); }, { passive: true }));
document.addEventListener('scroll', e => {
  const r = e.target; if (!r || r.id !== 'adrail' || !r.clientWidth) return;
  const k = Math.round(r.scrollLeft / r.clientWidth); if (k === S.ad % r.children.length) return;
  S.ad = k; document.querySelectorAll('#addots i').forEach((d, i) => d.classList.toggle('on', i === k));
}, true);
setInterval(() => {
  const r = document.getElementById('adrail');
  if (!r || document.hidden || S.sheet || S.drawer || S.review || r.children.length < 2 || Date.now() - adTouch < 8000) return;
  const k = (Math.round(r.scrollLeft / r.clientWidth) + 1) % r.children.length;
  r.scrollTo({ left: k * r.clientWidth, behavior: 'smooth' });
}, 4500);

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
render();
api('catalog').then(r => {
  if (r.ok) S.cat = r.catalog; else { S.cat = null; S.msg = r.error || 'تعذر تحميل البيانات'; }
  render();
});
</script>
</body>
</html>
